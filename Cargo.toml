[package]
name = "chess-analyzer"
version = "0.1.0"
edition = "2021"

[lib]
name = "chess_analyzer"
path = "src/lib.rs"

[[bin]]
name = "chess-analyzer"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["canvas", "svg", "tokio"] }
plotters = { version = "0.3", default-features = false, features = ["line_series", "area_series"] }
plotters-iced = "0.11"
shakmaty = "0.30"
pgn-reader = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.10"
rodio = "0.19"
