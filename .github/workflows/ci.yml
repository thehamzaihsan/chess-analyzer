name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache runtime assets (Stockfish, llama.cpp, Gemma model)
        uses: actions/cache@v4
        with:
          path: |
            assets/stockfish
            assets/coach
            assets/models
          key: runtime-assets-sf_19-llama_b11541-gemma-2-2b-it-Q4_K_M

      - name: Fetch runtime assets (needed by the golden-path e2e test)
        run: ./scripts/fetch-assets.sh

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true
