name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache runtime assets (Stockfish, llama.cpp, Gemma model)
        uses: actions/cache@v4
        with:
          path: |
            assets/stockfish
            assets/coach
            assets/models
          key: runtime-assets-sf_19-llama_b11541-gemma-2-2b-it-Q4_K_M

      - name: Fetch runtime assets (needed by the golden-path e2e test)
        run: ./scripts/fetch-assets.sh

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

  # Feature work lives on dev; main is release-only. Once dev's checks pass,
  # fast-forward main to dev automatically. ff-only means this never clobbers
  # main if it has diverged (e.g. a manual hotfix) — it just fails loudly.
  auto-merge-to-main:
    needs: check-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward main to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --ff-only origin/dev
          git push origin main
