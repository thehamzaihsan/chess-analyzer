name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Stockfish download
        uses: actions/cache@v4
        with:
          path: assets/stockfish
          key: stockfish-sf_19-linux-x86-64-universal

      - name: Fetch Stockfish (needed by engine tests)
        run: ./scripts/fetch-assets.sh stockfish

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true
