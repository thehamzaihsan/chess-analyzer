name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # Bundle the Stockfish engine (needed for Game Review) directly into the
      # release artifact so everything works out of the box.
      - name: Fetch Stockfish for packaging
        run: ./scripts/fetch-assets.sh stockfish

      - name: Package release archive
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
            TAG="v0.1.0"
            NAME="chess-analyzer-linux-x86_64"
          else
            TAG="$REF_NAME"
            NAME="chess-analyzer-${REF_NAME}-linux-x86_64"
          fi
          mkdir -p "dist/$NAME/assets/stockfish"
          cp target/release/chess-analyzer "dist/$NAME/"
          cp -r assets/stockfish/linux "dist/$NAME/assets/stockfish/linux"
          cp scripts/fetch-assets.sh "dist/$NAME/"
          cp README.md "dist/$NAME/"
          tar czf "dist/$NAME.tar.gz" -C dist "$NAME"
          echo "ARCHIVE_PATH=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: true
